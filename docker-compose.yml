services:
  mysql:
    image: mysql:8.0
    container_name: rush_scheduler_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rush_scheduler}
      MYSQL_USER: ${DB_USER:-rush_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
    ports:
      # Host 3307 -> container 3306: this machine already has a native MySQL
      # server bound to host port 3306, so the Docker one is exposed on 3307
      # instead. backend/.env's DB_PORT must match.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rush_scheduler_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
